<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">

  <title>NGUYENDEVS — WALLPAPER</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  
  <style id="clock-styles">
    :root {
      --clock-x: 10%;
      --clock-y: 50%;
      --clock-blur: 10px;
    }
    @media (min-width: 769px) {
      .timer-wrap {
        position: absolute;
        left: var(--clock-x) !important;
        top: var(--clock-y) !important;
        transform: translateY(-50%) !important;
        backdrop-filter: blur(var(--clock-blur)) !important;
        -webkit-backdrop-filter: blur(var(--clock-blur)) !important;
      }
    }
  </style>
</head>

<body>

  <div class="info-noise"></div>

  <div class="coming-soon">
    <div class="timer-wrap">
      <div class="ck-accent-line"></div>
      <div class="timer-label-top" id="cfg-label-top">nguyendevs đã tham gia server Trái Đất</div>
      
      <div class="timer-units">
        <div class="timer-unit">
          <div class="timer-num" id="y">--</div>
          <div class="timer-unit-label" id="cfg-label-y">Năm</div>
        </div>
        <div class="timer-sep">:</div>
        <div class="timer-unit">
          <div class="timer-num" id="mo">--</div>
          <div class="timer-unit-label" id="cfg-label-mo">Tháng</div>
        </div>
        <div class="timer-sep">:</div>
        <div class="timer-unit">
          <div class="timer-num" id="d">--</div>
          <div class="timer-unit-label" id="cfg-label-d">Ngày</div>
        </div>
        <div class="timer-sep">:</div>
        <div class="timer-unit">
          <div class="timer-num" id="h">--</div>
          <div class="timer-unit-label" id="cfg-label-h">Giờ</div>
        </div>
        <div class="timer-sep">:</div>
        <div class="timer-unit">
          <div class="timer-num" id="m">--</div>
          <div class="timer-unit-label" id="cfg-label-m">Phút</div>
        </div>
        <div class="timer-sep">:</div>
        <div class="timer-unit">
          <div class="timer-num" id="s">--</div>
          <div class="timer-unit-label" id="cfg-label-s">Giây</div>
        </div>
      </div>

      <div class="timer-progress-wrap">
        <div class="timer-progress-bg">
          <div class="timer-progress-fill" id="prog" style="width:0%"></div>
        </div>
        <div class="timer-progress-meta">
          <span id="year-label">Năm thứ --</span>
          <span id="pct">0%</span>
        </div>
      </div>

      <div class="timer-divider"></div>

      <div class="timer-total">
        <div class="timer-total-num" id="total-s">0</div>
        <div class="timer-total-label" id="cfg-label-total">TỔNG SỐ GIÂY ĐÃ CHƠI</div>
      </div>

      <div class="clock-current-wrap">
        <div class="ck-accent-line"></div>
        <div class="clock-header-row">
          <div class="clock-tag-label" id="cfg-label-current">Current Time</div>
          <div class="clock-tz-badge" id="current-tz">GMT+0</div>
        </div>
        <div class="clock-b-units">
          <div class="clock-b-unit">
            <div class="clock-num" id="current-h">00</div>
            <div class="clock-b-lbl" id="cfg-label-h-curr">Giờ</div>
          </div>
          <div class="clock-b-sep">:</div>
          <div class="clock-b-unit">
            <div class="clock-num" id="current-m">00</div>
            <div class="clock-b-lbl" id="cfg-label-m-curr">Phút</div>
          </div>
          <div class="clock-b-sep">:</div>
          <div class="clock-b-unit">
            <div class="clock-num clock-num--sec" id="current-s">00</div>
            <div class="clock-b-lbl" id="cfg-label-s-curr">Giây</div>
          </div>
        </div>
        <div class="clock-b-divider"></div>
        <div class="clock-b-bottom">
          <div class="clock-b-day" id="current-day">Thứ Tư</div>
          <div class="clock-b-date" id="current-date-sub">13/05/2026</div>
        </div>
        <div class="clock-day-prog-wrap">
          <div class="clock-day-prog-label">
            <span id="cfg-label-dayprog">% ngày hôm nay</span>
            <span class="clock-day-prog-pct" id="day-pct">0%</span>
          </div>
          <div class="clock-day-prog-bg">
            <div class="clock-day-prog-fill" id="day-prog" style="width:0%"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  
  <script>
    window.wallpaperConfig = {
      dirLightIntensity: 2.2,
      fillLightIntensity: 1.5,
      pointLightIntensity: 5.0,
      speed: 1.0,
      zoom: 18,
      offsetX: -4.5,
      offsetY: 2.0,
      ringAmount: 4,
      particleAmount: 5500,
      particleSize: 0.08,
      debrisAmount: 30,
      debrisSize: 1.0,
      birthDate: "2004-07-04T09:00:00+07:00",
      yearLabelText: "Năm thứ",
      mouseDrag: true,
      mouseFollow: false,
      mouseWeight: 50,
      musicEnable: true,
      musicSensitive: 50,
      musicStyle: "tectonic",
      clockMode: 0,
      clockEnable: true,
      ringSpacing: 1.0,
      endskyHoleSize: 80,
      endskyZoom: 1.0,
      endskyIterations: 16
    };
    window._wallpaperAudioData = new Array(128).fill(0);
  </script>

  <script src="assets/js/modules/Utils.js"></script>
  <script src="assets/js/modules/SceneManager.js"></script>
  <script src="assets/js/modules/InputController.js"></script>
  <script src="assets/js/modules/core/CoreMesh.js"></script>
  <script src="assets/js/modules/core/FilamentSystem.js"></script>
  <script src="assets/js/modules/core/FlareSystem.js"></script>
  <script src="assets/js/modules/core/AuraSystem.js"></script>
  <script src="assets/js/modules/CoreSystem.js"></script>
  <script src="assets/js/modules/RingSystem.js"></script>
  <script src="assets/js/modules/DebrisSystem.js"></script>
  <script src="assets/js/modules/ParticleSystem.js"></script>
  <script src="assets/js/modules/WallpaperEngine.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/endsky-bg.js"></script>

  <script>
    let prevS = -1, prevM = -1, prevH = -1, prevD = -1;
    function fmt(n) { return String(n).padStart(2, '0'); }
    function flash(id) {
      const el = document.getElementById(id);
      if (!el) return; el.classList.add('flash');
      setTimeout(() => el.classList.remove('flash'), 300);
    }

    let prevSH = -1, prevSM = -1, prevSS = -1;
    function updateClock() {
      const cfg = window.wallpaperConfig;
      const now = new Date();

      // Update Birth Time (Keep existing logic)
      const birthDate = new Date(cfg.birthDate);
      if (!isNaN(birthDate.getTime())) {
        const diffMs = now - birthDate, totalSecs = Math.floor(diffMs / 1000);
        let years = now.getFullYear() - birthDate.getFullYear(), months = now.getMonth() - birthDate.getMonth(), days = now.getDate() - birthDate.getDate(), hours = now.getHours() - birthDate.getHours(), minutes = now.getMinutes() - birthDate.getMinutes(), seconds = now.getSeconds() - birthDate.getSeconds();
        if (seconds < 0) { seconds += 60; minutes--; }
        if (minutes < 0) { minutes += 60; hours--; }
        if (hours < 0) { hours += 24; days--; }
        if (days < 0) { days += new Date(now.getFullYear(), now.getMonth(), 0).getDate(); months--; }
        if (months < 0) { months += 12; years--; }

        document.getElementById('y').textContent = years;
        document.getElementById('mo').textContent = fmt(months);
        document.getElementById('d').textContent = fmt(days);
        document.getElementById('h').textContent = fmt(hours);
        document.getElementById('m').textContent = fmt(minutes);
        document.getElementById('s').textContent = fmt(seconds);
        document.getElementById('total-s').textContent = totalSecs.toLocaleString();
        document.getElementById('year-label').textContent = `${cfg.yearLabelText} ${years + 1}`;

        if (seconds !== prevS) { flash('s'); prevS = seconds; }
        if (minutes !== prevM) { flash('m'); prevM = minutes; }
        if (hours !== prevH) { flash('h'); prevH = hours; }
        if (days !== prevD) { flash('d'); prevD = days; }

        const daysInYear = (years % 4 === 0 && (years % 100 !== 0 || years % 400 === 0)) ? 366 : 365;
        const startOfYear = new Date(now.getFullYear(), birthDate.getMonth(), birthDate.getDate(), birthDate.getHours(), birthDate.getMinutes(), birthDate.getSeconds());
        if (now < startOfYear) startOfYear.setFullYear(now.getFullYear() - 1);
        const yearPct = Math.min(100, ((now - startOfYear) / (daysInYear * 86400000)) * 100).toFixed(1);
        document.getElementById('prog').style.width = yearPct + '%';
        document.getElementById('pct').textContent = yearPct + '%';
      }

      // Update Current Time (New Detailed UI)
      let hh = now.getHours();
      const mm = now.getMinutes();
      const ss = now.getSeconds();
      
      document.getElementById('current-h').textContent = fmt(hh);
      document.getElementById('current-m').textContent = fmt(mm);
      document.getElementById('current-s').textContent = fmt(ss);

      if (ss !== prevSS) { flash('current-s'); prevSS = ss; }
      if (mm !== prevSM) { flash('current-m'); prevSM = mm; }
      if (hh !== prevSH) { flash('current-h'); prevSH = hh; }

      // Date & Day
      const daysEN = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
      document.getElementById('current-day').textContent = daysEN[now.getDay()];
      document.getElementById('current-date-sub').textContent = `${fmt(now.getDate())}/${fmt(now.getMonth() + 1)}/${now.getFullYear()}`;

      // Timezone
      const offset = -now.getTimezoneOffset() / 60;
      const tzStr = "GMT" + (offset >= 0 ? "+" : "") + offset;
      document.getElementById('current-tz').textContent = tzStr;

      // Day progress
      const secOfDay = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
      const dayPctValue = (secOfDay / 86400 * 100).toFixed(1);
      const dpEl = document.getElementById('day-prog');
      const dpPct = document.getElementById('day-pct');
      if (dpEl) dpEl.style.width = dayPctValue + '%';
      if (dpPct) dpPct.textContent = dayPctValue + '%';

      // Handle Visibility
      const wrap = document.querySelector('.timer-wrap');
      if (cfg.clockMode === 1) {
        wrap.classList.add('mode-current');
      } else {
        wrap.classList.remove('mode-current');
      }
    }

    setInterval(updateClock, 1000); updateClock();

    // Wave Effect & Double Click
    document.querySelector('.timer-wrap').addEventListener('dblclick', function(e) {
      const wave = document.createElement('div');
      wave.className = 'wave-effect';
      wave.style.left = e.clientX + 'px';
      wave.style.top = e.clientY + 'px';
      document.body.appendChild(wave);
      setTimeout(() => wave.remove(), 600);

      window.wallpaperConfig.clockMode = window.wallpaperConfig.clockMode === 0 ? 1 : 0;
      updateClock();
    });

    window.wallpaperPropertyListener = {
      applyUserProperties: function(properties) {
        if (properties.dirlight_intensity) window.wallpaperConfig.dirLightIntensity = properties.dirlight_intensity.value;
        if (properties.filllight_intensity) window.wallpaperConfig.fillLightIntensity = properties.filllight_intensity.value;
        if (properties.pointlight_intensity) window.wallpaperConfig.pointLightIntensity = properties.pointlight_intensity.value;
        if (properties.corespeed) window.wallpaperConfig.speed = properties.corespeed.value;
        if (properties.corezoom) window.wallpaperConfig.zoom = properties.corezoom.value;
        if (properties.ringspacing) { window.wallpaperConfig.ringSpacing = properties.ringspacing.value; window.dispatchEvent(new CustomEvent('threejs-update', {detail: {type:'rings'}})); }
        if (properties.coreoffsetx) { window.wallpaperConfig.offsetX = properties.coreoffsetx.value; window.dispatchEvent(new Event('resize')); }
        if (properties.coreoffsety) { window.wallpaperConfig.offsetY = properties.coreoffsety.value; window.dispatchEvent(new Event('resize')); }
        if (properties.ringamount) { window.wallpaperConfig.ringAmount = properties.ringamount.value; window.dispatchEvent(new CustomEvent('threejs-update', {detail: {type:'rings'}})); }
        if (properties.particleamount) { window.wallpaperConfig.particleAmount = properties.particleamount.value; window.dispatchEvent(new CustomEvent('threejs-update', {detail: {type:'particles'}})); }
        if (properties.particlesize) { window.wallpaperConfig.particleSize = properties.particlesize.value; window.dispatchEvent(new CustomEvent('threejs-update', {detail: {type:'particlesize'}})); }
        if (properties.debrisamount) { window.wallpaperConfig.debrisAmount = properties.debrisamount.value; window.dispatchEvent(new CustomEvent('threejs-update', {detail: {type:'debris'}})); }
        if (properties.debrissize) { window.wallpaperConfig.debrisSize = properties.debrissize.value; window.dispatchEvent(new CustomEvent('threejs-update', {detail: {type:'debrissize'}})); }
        if (properties.glowsize) window.wallpaperConfig.glowSize = properties.glowsize.value;
        if (properties.glowintensity) window.wallpaperConfig.glowIntensity = properties.glowintensity.value;
        
        if (properties.endsky_hole_size) window.wallpaperConfig.endskyHoleSize = properties.endsky_hole_size.value;
        if (properties.endsky_zoom) window.wallpaperConfig.endskyZoom = properties.endsky_zoom.value;
        if (properties.endsky_iterations) window.wallpaperConfig.endskyIterations = properties.endsky_iterations.value;
        
        if (properties.mousedrag) window.wallpaperConfig.mouseDrag = properties.mousedrag.value;
        if (properties.mousefollow) window.wallpaperConfig.mouseFollow = properties.mousefollow.value;
        if (properties.mouseweight) window.wallpaperConfig.mouseWeight = properties.mouseweight.value;
        
        if (properties.musicenable) window.wallpaperConfig.musicEnable = properties.musicenable.value;
        if (properties.musicsensitive) window.wallpaperConfig.musicSensitive = properties.musicsensitive.value;
        if (properties.musicstyle) window.wallpaperConfig.musicStyle = properties.musicstyle.value;

        if (properties.clockmode) window.wallpaperConfig.clockMode = parseInt(properties.clockmode.value);
        if (properties.clockenable) {
            window.wallpaperConfig.clockEnable = properties.clockenable.value;
            document.querySelector('.timer-wrap').style.display = properties.clockenable.value ? '' : 'none';
        }
        
        if (properties.birthdate) { window.wallpaperConfig.birthDate = properties.birthdate.value; updateClock(); }
        if (properties.timerlabeltop) document.getElementById('cfg-label-top').textContent = properties.timerlabeltop.value;
        if (properties.timertotallabel) document.getElementById('cfg-label-total').textContent = properties.timertotallabel.value;
        if (properties.yearlabeltext) { window.wallpaperConfig.yearLabelText = properties.yearlabeltext.value; updateClock(); }
        if (properties.currenttimelabel) document.getElementById('cfg-label-current').textContent = properties.currenttimelabel.value;
        if (properties.dayprogresslabel) document.getElementById('cfg-label-dayprog').textContent = properties.dayprogresslabel.value;
        
        const root = document.documentElement;
        if (properties.clockoffsetx) root.style.setProperty('--clock-x', properties.clockoffsetx.value + '%');
        if (properties.clockoffsety) root.style.setProperty('--clock-y', properties.clockoffsety.value + '%');
        if (properties.clockblur) root.style.setProperty('--clock-blur', properties.clockblur.value + 'px');

        const labels = ['year', 'month', 'day', 'hour', 'minute', 'second'];
        labels.forEach(l => {
            const prop = properties['label_' + l];
            if (prop) {
                const char = (l === 'month' ? 'mo' : l.charAt(0));
                const id = 'cfg-label-' + char;
                const el = document.getElementById(id);
                if (el) el.textContent = prop.value;
                
                // Update Current Clock labels if they exist
                const elCurr = document.getElementById(id + '-curr');
                if (elCurr) elCurr.textContent = prop.value;
            }
        });
      }
    };

    window.wallpaperRegisterAudioListener(function(audioData) {
        const combined = new Array(64);
        for (let i = 0; i < 64; i++) {
            combined[i] = Math.max(audioData[i], audioData[i + 64]);
        }
        window._wallpaperAudioData = combined;
    });
  </script>

</body>
</html>
